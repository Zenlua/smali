apply plugin: 'antlr'
apply plugin: 'org.xbib.gradle.plugin.jflex'

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath depends.jflex_plugin
        classpath depends.proguard_gradle
    }
}

configurations {
    // Remove the full antlr library that's added by the antlr plugin. We manually
    // add the smaller antlr_runtime library instead
    implementation.exclude group: 'org.antlr', module: 'antlr'
}

sourceSets {
    main {
        java {
            srcDirs "${project.rootDir}/third_party/smali/src/main/java"
        }
        resources {
            // This adds the generated .tokens files to the jar
            srcDir 'build/generated-src/antlr/main'
        }
    }
    test {
        java {
            srcDirs "${project.rootDir}/third_party/smali/src/test/java"
        }
    }
}

idea {
    module {
        excludeDirs -= buildDir
        if (buildDir.exists()) {
            excludeDirs.addAll(buildDir.listFiles())
        }
        for (sourceDir in (sourceDirs + testSourceDirs)) {
            excludeDirs.remove(sourceDir);
            while ((sourceDir = sourceDir.getParentFile()) != null) {
                excludeDirs.remove(sourceDir);
            }
        }
    }
}

dependencies {
    implementation project(':util')
    api project(':dexlib2')
    implementation depends.antlr_runtime
    implementation depends.jcommander
    implementation depends.stringtemplate
    implementation depends.guava

    testImplementation depends.junit

    antlr depends.antlr
}

processResources.inputs.property('version', version)
processResources.expand('version': version)
processResources.dependsOn('generateGrammarSource')

// Build a separate jar that contains all dependencies
task fatJar(type: Jar, dependsOn: jar) {
    dependsOn ':dexlib2:jar'
    dependsOn ':util:jar'
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }

    duplicatesStrategy = 'exclude'
    archiveClassifier = 'fat'

    // [TỐI ƯU 1]: Lọc bỏ các file rác/metadata không sử dụng
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/maven/**'
    exclude '**/*.proto'
    exclude '**/*.txt'

    manifest {
        attributes('Main-Class': 'com.android.tools.smali.smali.Main')
    }

    doLast {
        if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
            ant.symlink(link: file("${destinationDirectory.get()}/smali.jar"), resource: archivePath, overwrite: true)
        }
    }
}
tasks.getByPath('build').dependsOn(fatJar)

generateTestGrammarSource {
    outputDirectory = new File(outputDirectory, 'com/android/tools/smali/smali')
}

generateGrammarSource {
    outputDirectory = new File(outputDirectory, 'com/android/tools/smali/smali')
}

jflex {
    generateDir = new File(generateDir, 'com/android/tools/smali/smali')
}

publish {
    publishing {
        publications {
            mavenJava(MavenPublication) {
                pom {
                    description = 'smali is an assembler for dalvik bytecode'
                    scm {
                        url = 'https://github.com/google/smali/tree/master/smali'
                    }
                }
            }
        }
    }
}

// [TỐI ƯU 2]: Task ProGuard nén ép dung lượng siêu nhẹ & sửa toàn bộ lỗi Runtime
task proguard(type: proguard.gradle.ProGuardTask, dependsOn: fatJar) {
    def destinationDir = fatJar.destinationDirectory.get().asFile
    def outFile = new File(destinationDir, "${fatJar.archiveBaseName.get()}-${fatJar.archiveVersion.get()}-small.jar")

    injars fatJar.archiveFile.get().asFile
    outjars outFile

    def javaHome = System.getProperty("java.home")
    if (file("${javaHome}/jmods").exists()) {
        libraryjars("${javaHome}/jmods")
    } else if (file("${javaHome}/lib/rt.jar").exists()) {
        libraryjars("${javaHome}/lib/rt.jar")
    }

    // 1. Giữ lại AnnotationDefault, Metadata & Attributes quan trọng phục vụ Reflection
    keepattributes 'AnnotationDefault,*Annotation*,Signature,InnerClasses,EnclosingMethod'

    // 2. Không đổi tên Class (giữ nguyên để CLI gọi đúng)
    dontobfuscate
    optimizationpasses 2

    ignorewarnings
    dontwarn
    dontnote


    // 4. Giữ toàn bộ Class lệnh CLI của Smali và Annotation (Đã bọc chuỗi '...' chuẩn)
    keep 'public class com.android.tools.smali.smali.Main { public static void main(java.lang.String[]); }'
    keep 'class com.beust.jcommander.** { *; }'
    keep '@interface * { *; }'
    keepclassmembers 'class * { @com.beust.jcommander.** <fields>; }'
    keepclassmembers 'class * { @com.android.tools.smali.util.jcommander.** <fields>; }'
    keepclassmembers 'class * { @com.beust.jcommander.** <methods>; }'
    keepclassmembers 'class * { @com.android.tools.smali.util.jcommander.** <methods>; }'
    keepclassmembers 'enum * { public static **[] values(); public static ** valueOf(java.lang.String); }'

    dontwarn 'com.google.common.**'
    dontnote 'com.google.common.**'
    
    doLast {
        def mainJar = new File(destinationDir, "smali.jar")
        if (mainJar.exists()) {
            mainJar.delete()
        }
        ant.copy(file: outFile, tofile: mainJar)
        println "==> Sửa lỗi & tối ưu thành công! Đã cập nhật smali.jar hoàn chỉnh."
    }
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
sourcesJar.dependsOn('generateGrammarSource')
sourcesJar.dependsOn('jflex')

tasks.getByPath(':release').dependsOn(proguard)
