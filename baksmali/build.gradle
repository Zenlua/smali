buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath depends.proguard_gradle
    }
}

sourceSets {
    main {
        java {
            srcDirs "${project.rootDir}/third_party/baksmali/src/main/java"
        }
    }
}

dependencies {
    implementation project(':util')
    api project(':dexlib2')
    implementation depends.guava
    implementation depends.jcommander

    testImplementation depends.junit
    testImplementation project(':smali')
    testImplementation depends.antlr_runtime
}

processResources.inputs.property('version', version)
processResources.expand('version': version)

// Build a separate jar that contains all dependencies
task fatJar(type: Jar) {
    dependsOn ':dexlib2:jar'
    dependsOn ':util:jar'
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }

    duplicatesStrategy = 'exclude'
    archiveClassifier = 'fat'

    // [TỐI ƯU 1]: Lọc bỏ các file rác/metadata không sử dụng
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/maven/**'
    exclude '**/*.proto'
    exclude '**/*.txt'

    manifest {
        attributes('Main-Class': 'com.android.tools.smali.baksmali.Main')
    }

    doLast {
        if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
            ant.symlink(link: file("${destinationDirectory.get()}/baksmali.jar"), resource: archivePath, overwrite: true)
        }
    }
}
tasks.getByPath('build').dependsOn(fatJar)

publish {
    publishing {
        publications {
            mavenJava(MavenPublication) {
                pom {
                    description = 'baksmali is a disassembler for dalvik bytecode'
                    scm {
                        url = 'https://github.com/google/smali/tree/master/baksmali'
                    }
                }
            }
        }
    }
}

// [TỐI ƯU 2]: Task ProGuard nén ép dung lượng siêu nhẹ & sửa lỗi AnnotationFormatError
task proguard(type: proguard.gradle.ProGuardTask, dependsOn: fatJar) {
    def destinationDir = fatJar.destinationDirectory.get().asFile
    def outFile = new File(destinationDir, "${fatJar.archiveBaseName.get()}-${fatJar.archiveVersion.get()}-small.jar")

    injars fatJar.archiveFile.get().asFile
    outjars outFile

    def javaHome = System.getProperty("java.home")
    if (file("${javaHome}/jmods").exists()) {
        libraryjars("${javaHome}/jmods")
    } else if (file("${javaHome}/lib/rt.jar").exists()) {
        libraryjars("${javaHome}/lib/rt.jar")
    }

    // 1. Keep Attributes cần thiết
    keepattributes 'AnnotationDefault,*Annotation*,Signature,InnerClasses,EnclosingMethod'

    // 2. Không đổi tên Class
    dontobfuscate
    dontoptimize
    ignorewarnings
    dontwarn
    dontnote

    keep '@interface * { *; }'
    keepclassmembers 'class * { @com.beust.jcommander.** <fields>; }'
    keepclassmembers 'class * { @com.android.tools.smali.util.jcommander.** <fields>; }'
    keepclassmembers 'class * { @com.beust.jcommander.** <methods>; }'
    keepclassmembers 'class * { @com.android.tools.smali.util.jcommander.** <methods>; }'
    keep 'public class com.android.tools.smali.baksmali.Main { public static void main(java.lang.String[]); }'
    keep 'public class com.android.tools.smali.util.jcommander.ColonParameterSplitter'
    keep 'class com.beust.jcommander.** { *; }'
    keepclassmembers 'enum * { public static **[] values(); public static ** valueOf(java.lang.String); }'

    dontwarn 'com.google.common.**'
    dontnote 'com.google.common.**'
    
    doLast {
        def mainJar = new File(destinationDir, "baksmali.jar")
        if (mainJar.exists()) {
            mainJar.delete()
        }
        ant.copy(file: outFile, tofile: mainJar)
        println "==> Sửa lỗi AnnotationFormatError thành công! Đã cập nhật baksmali.jar hoàn chỉnh."
    }
}

tasks.getByPath(':release').dependsOn(proguard)

task fastbuild(dependsOn: build) {
}

task fb(dependsOn: fastbuild) {
}

tasks.getByPath('javadoc').onlyIf({
    !gradle.taskGraph.hasTask(fastbuild)
})

tasks.getByPath('test').onlyIf({
    !gradle.taskGraph.hasTask(fastbuild)
})
